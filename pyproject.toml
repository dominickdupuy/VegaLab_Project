[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optspread"
version = "0.1.0"
description = "Leak-tested SPX options simulator and detection-floor calibration harness (Vega Lab, CIS 4914)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The learner (decision D3: Stable-Baselines3 PPO at fixed hyperparameters). An
# extra rather than a core dependency so `make check` does not pull torch: nothing
# in optspread/ imports it, and the benchmark and gate report report it as
# unmeasured when it is absent.
train = [
    "stable-baselines3>=2.3",
]
# The dashboard (W6-6): `make serve` runs optspread.server over the static site that
# `make web` builds into web/out. An extra for the same reason as `train`: `make check`
# runs without it. The builders the server returns (optspread.webapi, .dashboard_data,
# .dashboard_panel, .jobs) need none of it apart from the one parquet reader, so they
# are tested and covered on the plain `dev` install; httpx is for the server's tests.
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyarrow>=15",
    "httpx>=0.27",
]
# The real SPX data path (optspread.realdata, scripts/build_spx_panel.py). pandas and
# pyarrow are also in dev so CI type-checks and tests that code; databento is only
# needed to decode the OPRA batches, and is imported inside the one function that does.
data = [
    "pandas>=2.2",
    "pyarrow>=15",
    "databento>=0.40",
]
dev = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pandas-stubs>=2.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.88",
    "mypy>=1.14",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["optspread*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N803", "N806"]  # math-style names (S, K, T) are clearer than PEP 8 here

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "gymnasium.*",
    "stable_baselines3.*",
    "torch.*",
    "pyarrow.*",
    "fastapi.*",
    "starlette.*",
    "uvicorn.*",
    "pyarrow",
    "databento",
    "wrds",
    "sqlalchemy",
    "sqlalchemy.*",
]
ignore_missing_imports = true

# Without the dashboard extra FastAPI is untyped, and its route decorators with it.
# Installed, they are typed and this changes nothing; the routes themselves are typed.
[[tool.mypy.overrides]]
module = ["optspread.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
