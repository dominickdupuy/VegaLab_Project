name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check optspread tests scripts
      - run: ruff format --check optspread tests scripts
      - run: mypy --strict optspread scripts
      - run: pytest tests/ --cov=optspread --cov-report=term-missing --cov-fail-under=85
  check-dashboard:
    # the server and the parquet reader, which the plain dev install skips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,dashboard]"
      - run: mypy --strict optspread scripts
      - run: pytest tests/ --cov=optspread --cov-report=term-missing --cov-fail-under=85
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
